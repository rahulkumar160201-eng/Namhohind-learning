<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Public Feedback and Review System for Namhohind Bihar GK platform.">
    <title>Reviews & Feedback | Namhohind Bihar GK</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="feedback.css">
</head>
<body data-page="feedback">
    <header class="site-header">
        <a class="brand" href="index.html" aria-label="Namhohind Bihar GK home">
            <img src="bihar-logo.png" alt="Bihar logo">
            <span><strong>Namhohind</strong><small>Bihar GK Learning Hub</small></span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="bihar-gk-page1.html">Bihar GK</a>
            <a href="current-affairs.html">Current Affairs</a>
            <a href="quiz-dashboard.html">Quiz</a>
            <a href="pdf-notes.html">PDF Notes</a>
            <a href="ai.html" style="color:var(--saffron); font-weight:bold;">🤖 AI (Beta)</a>
            <a class="active" href="feedback.html">⭐ Reviews & Feedback</a>
        </nav>
    </header>

    <main class="feedback-main">
        <section class="feedback-header">
            <h1>Platform Reviews & Feedback</h1>
            <div class="average-rating-container" id="averageRatingContainer">
                <!-- Populated by JS -->
            </div>
        </section>

        <section class="feedback-layout">
            <aside class="feedback-form-container">
                <h2>Submit Your Review</h2>
                <form id="feedbackForm">
                    <label for="fbName">User Name</label>
                    <input type="text" id="fbName" required placeholder="Enter your name">

                    <label for="fbCategory">Category</label>
                    <select id="fbCategory" required>
                        <option value="Bihar GK">Bihar GK</option>
                        <option value="Current Affairs">Current Affairs</option>
                        <option value="Bihar Police">Bihar Police</option>
                        <option value="BPSC">BPSC</option>
                        <option value="Namhohind AI">Namhohind AI</option>
                    </select>

                    <label>Star Rating</label>
                    <div class="star-rating-input">
                        <input type="radio" id="star5" name="fbRating" value="5" required><label for="star5" title="5 stars">★</label>
                        <input type="radio" id="star4" name="fbRating" value="4"><label for="star4" title="4 stars">★</label>
                        <input type="radio" id="star3" name="fbRating" value="3"><label for="star3" title="3 stars">★</label>
                        <input type="radio" id="star2" name="fbRating" value="2"><label for="star2" title="2 stars">★</label>
                        <input type="radio" id="star1" name="fbRating" value="1"><label for="star1" title="1 star">★</label>
                    </div>

                    <label for="fbComment">Comment</label>
                    <textarea id="fbComment" rows="4" required placeholder="Share your experience..."></textarea>

                    <button type="submit" class="btn btn-primary w-full">Post Feedback</button>
                </form>
            </aside>

            <section class="feedback-wall">
                <h2>Public Feedback Wall</h2>
                <div id="reviewsList" class="reviews-list">
                    <!-- Reviews populated by JS -->
                </div>
            </section>
        </section>
    </main>

    <script src="feedback.js"></script>
</body>
</html>
